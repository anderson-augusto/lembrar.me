<script>
async function carregarAlbuns() {
    const idUsuario = sessionStorage.ID_USUARIO || 0; 

    const response = await fetch(`/album/listar/${idUsuario}`);
    if (!response.ok) {
        console.error("Erro ao carregar álbuns", response.statusText);
        return;
    }
    const lista = await response.json();

    const secao = document.querySelector(".albuns");
    secao.innerHTML = "";

    if(!Array.isArray(lista) || lista.length === 0){
        secao.innerHTML = "<p>Nenhum álbum disponível</p>";
        return;
    }

    lista.forEach(album => {
        const div = document.createElement("div");
        div.className = "album-item";

        const img = document.createElement("img");
        // album.capa (sql acima) ou fallback
        img.src = album.capa || "https://cdn-icons-png.flaticon.com/512/4211/4211547.png";
        img.alt = album.nome || "Álbum";

        img.onclick = () => {
            sessionStorage.ID_ALBUM = album.idAlbum; 
            window.location = "album.html";
        }

        const p = document.createElement("p");
        p.textContent = album.nome;

        div.appendChild(img)
        div.appendChild(p)

        secao.appendChild(div)
    })
}

window.onload = carregarAlbuns;
</script>
