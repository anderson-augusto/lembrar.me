<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet" />
    <title>Cadastro Lembre.me</title>
    <link rel="stylesheet" href="./src/style/style.css">
</head>

<body>
    <header> <!-- Header é um elemento semantico, tem seus proprios comportamentos-->
        <div class="header-logo">
            <a href="index.html"><img src="./src/img/logo2.png" class="titulo"></a>
        </div>
        <nav> <!-- Nav também-->
            <ul>
                <li class="listagem">
                    <a href="index.html#historia"><span class="material-symbols-outlined">
                            <!-- essa classe referencia o css que adiciona um comportamento para os icones, ou sobre a cor ou sobre o preenchimento-->
                            Camera <!-- aqui vão o nome dos Icones do google-->
                        </span>História da Fotografia</a>
                </li>
                <li>
                    <a href="#sobre"><span class="material-symbols-outlined">
                            Photo_Library
                        </span>Importância da Fotografia</a>
                </li>
            </ul>
        </nav>
        <div class="header-botao">
            <a href="login.html">Entrar</a>
            <a href="cadastro.html">Cadastra-se</a>
        </div>
    </header>
    <main>
    <div class="login-container">

        <div class="login-box">
            <h1 class="login-logo">Lembre.me</h1>
            <h2 class="login-titulo">Crie sua conta</h2>
            <p class="login-sub">Comece a guardar suas memórias hoje.</p>

            <div class="formulario">

                <label for="inpt_nome">Nome</label>
                <div class="input-group">
                    <input type="text" placeholder="Seu nome completo" id="inpt_nome">
                    <span class="material-symbols-outlined">person</span>
                </div>

                <label for="inpt_email">Email</label>
                <div class="input-group">
                    <input type="email" placeholder="seuemail@exemplo.com" id="inpt_email">
                    <span class="material-symbols-outlined">mail</span>
                </div>

                <label for="inpt_senha">Senha</label>
                <div class="input-group">
                    <input type="password" placeholder="Crie uma senha forte" id="inpt_senha">
                    <span class="material-symbols-outlined">lock</span>
                </div>

                <label for="inpt_confirmaSenha">Confirmar Senha</label>
                <div class="input-group">
                    <input type="password" placeholder="Repita sua senha" id="inpt_confirmaSenha">
                    <span class="material-symbols-outlined">sync_lock</span>
                </div>

                <button class="btn-cadastrar" onclick="cadastrar()">Cadastrar</button>

                <p class="login-link">
                    Já tem uma conta? <a href="login.html">Faça login</a>
                </p>
            </div>
        </div>

        <div class="login-img">
            <img src="./src/img/polaroids2.jpg" alt="Imagem de Fotos">
        </div>

    </div>
</main>

</body>

</html>

<script>

  function cadastrar() {

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = inpt_nome.value;
    var emailVar = inpt_email.value;
    var senhaVar = inpt_senha.value;
    var confirmacaoSenhaVar = inpt_confirmaSenha.value;

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
    ) {
         alert('Algum campo em branco');
             return false;
    };

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {

          alert('Cadastro realizado com sucesso! Redirecionando para tela de Login...')

          setTimeout(() => {
            window.location = "./login.html";
          }, "500");

        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });

    return false;
  }

</script>
