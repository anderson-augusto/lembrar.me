<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet" />
    <title>Login Lembre.me</title>
    <link rel="stylesheet" href="./src/style/style.css">
</head>
<body>
    <header>
        <div class="header-logo">
            <a href="index.html"><img src="./src/img/logo.png" class="titulo"></a>
        </div>
        <nav> 
            <ul>
                <li class="listagem">
                    <a href="index.html#historia"><span class="material-symbols-outlined">
                            Camera
                        </span>História da Fotografia</a>
                </li>
                <li>
                    <a href="index.html#importancia"><span class="material-symbols-outlined">
                            Photo_Library
                        </span>Importância da Fotografia</a>
                </li>
            </ul>
        </nav>
        <div class="header-botao">
            <a href="login.html">Entrar</a>
            <a href="cadastro.html">Cadastra-se</a>
        </div>
    </header>
    <main>
    <div class="login-container">

        <div class="login-box">
            <h1 class="login-logo">Lembre.me</h1>
            <h2 class="login-titulo">Bem-vindo de volta!</h2>
            <p class="login-sub">Acesse sua galeria de memórias.</p>

            <div class="formulario">

                <label for="inpt_email">Email</label>
                <div class="input-group">
                    <input placeholder="seuemail@exemplo.com" id="inpt_email">
                    <span class="material-symbols-outlined">mail</span>
                </div>

                <label for="inpt_senha">Senha</label>
                <div class="input-group">
                    <input type="password" placeholder="Digite sua Senha" id="inpt_senha">
                    <span class="material-symbols-outlined">lock</span>
                </div>

                <p class="recuperar-senha"> <a href="https://youtu.be/M9AIMqOEI0g">Esqueceu sua senha?</a></p>

                <button class="btn-entrar" onclick="entrar()"> Entrar</button>

                <p class="login-link">
                    Ainda não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
                </p>
            </div>
        </div>

        <div class="login-img">
            <img src="./src/img/polaroids2.jpg" alt="Imagem de Fotos">
        </div>

    </div>
</main>

</body>
</html>
<script>

 function entrar() {

        var emailVar = inpt_email.value;
        var senhaVar = inpt_senha.value;

        if (emailVar == "" || senhaVar == "") {

           alert("UM DOS CAMPOS EM BRANCO");
            return false;
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.idUsuario;
                    sessionStorage.PERFIL= json.perfil;
                    window.location = "./main.html";
                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }
</script>
